    <title>Find Largest Number among 3 Numbers - JavaScript Logic Building</title>

<body>

            <a href="https://youtu.be/G_1ardR2YHY?si=8pmbzXDMqcsw7hPo" target="_blank">Find Largest Number among 3 Numbers</a>

    <p>Please inspect the page and open the Console tab in the Developer Tools.</p>



    <script>

        let a = 20;
        let b = 25;
        let c = 25;
        let largest;
        
        if(a > b && a > c){
            largest = a;
            // console.log("A is the largest Number");
        }
        else if(b > a && b > c){
            largest = b;
        }
        else if(c > a && c > b){
            largest = c;
        }
        else{
            console.log("Some Number are equal");
        }

        console.log(`${largest} Largest Numbers is `);
        

        


    </script>

</body>
