    <title>JavaScript Logic Building Problem 03</title>

<body>

        <script>

            function oddevenchecker(n){

                if(n % 2 == 0){
                    return "Even";
                }

                return "Odd";

            }

            // calling of function 
            // let a  = oddevenchecker(4);
            console.log(oddevenchecker(19))
            
            let a = Number(prompt("Enter Number: "));
            
            console.log(oddevenchecker(a))

        </script>
    
</body>
