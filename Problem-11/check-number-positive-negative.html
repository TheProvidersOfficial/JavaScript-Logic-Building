<body>

    <a href="https://youtu.be/a4eT4EP_y2M?si=tIlbDw-8RkNMsugn" target="_blank">Learn Check if Number is Positive, Negative, or Zero in JS  </a>

    <p>Please inspect the page and open the Console tab in the Developer Tools.</p>


    <h2>Check if Number is Positive, Negative or Zero # 11</h2>

    <script>

        function findNumber(n){

            if(n > 0){
                return "Positive"
            }
            else if(n < 0){
                return "Negative"
            }
            else{
                return "Zero"
            }
        }
        let number = Number(prompt("Enter Number: "));

        console.log("Number is : " + findNumber(number))

    </script>



</body>
