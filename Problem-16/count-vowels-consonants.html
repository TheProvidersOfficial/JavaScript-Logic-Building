    <p>Please inspect the page and open the Console tab in the Developer Tools.</p>

    
    <h2>Count Number of Vowels & Consonants # 16</h2>

    <script>

        const str = "The Providers";        

        let vowels = 0;
        let consonants = 0;
        let vowellist = "aeiou";

        for(let char of str.toLowerCase()){
            
            // if(char == "a" || char == "e" || char == "i" 
            // || char == "o" || char == "u"){
            //     vowels++;
            // }
            if(vowellist.includes(char)){ //true
                vowels++;
            }
            else if(char >= 'a' && char <= 'z'){
                consonants++;
            }

        }

        console.log("Vowels: ", vowels);
        console.log("Consonants: ", consonants);




    </script>


</body>
