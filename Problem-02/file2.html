<body>

    <script>
        // 1 + 2 + 3 + 4 + 5 = 15
        // sum of first numbers using a loop 
        function sumofFirst(n){
            let sum = 0;
            for(let i =1; i <= n; i++){
                sum = sum + i;
                // sum +=i;
            }
            return sum;
        }   

    //    let a =  sumofFirst(5);
           console.log(sumofFirst(5));
        //    console.log(sumofFirst(10));
        //    time complexity O(n)

        function sumofFirstNumbers(n){

            if(n < 1){
                return "Invalid Input";
            }

            let sum = n * (n+1) / 2;
            return sum;
        }
        
        console.log(sumofFirstNumbers(10));
         //    time complexity O(1) 

    </script>
