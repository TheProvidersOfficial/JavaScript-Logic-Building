<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Prime Number in JS - Logic Building </title>
</head>
<body>

        <a href="https://youtu.be/mGgVuuRtQJI?si=oAbVfPSkrDWbfeQi" target="_blank">Check Prime Number in JS </a>

    <p>Please inspect the page and open the Console tab in the Developer Tools.</p>


    <script>
        // 5
        function isPrime(n){

            if(n <= 1){
                return false;
            }

            for(let i = 2; i < n;i++){
                if(n % i == 0){
                    return false;
                }
            }

            return true;

        }

        let num = 17;

        if(isPrime(num)){
            console.log(`${num} is prime number`);
            
        }
        else{
            console.log(`${num} is not prime number`);

        }
        

    </script>
    
</body>
</html>
