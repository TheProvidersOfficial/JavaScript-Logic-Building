<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Logic Building Problem 01</title>
</head>
<body>

    <script>


        for(let i= 1; i <= 2; i++){
            document.write("<p>Hello world</p>")
            document.write("==========");
        }

        for(let i =1; i <= 10; i++){
            document.write("<p>" + i + "Hello World </p>");
        }

        document.write("=================================")

        for(let i = 10; i >= 1; i--){
            document.write( "<p>" + i + " Hello World </p>");
        }

        document.write("loop terminate")
        document.write("loop terminate")
        document.write("loop terminate")
        document.write("loop terminate")


    </script>
    
</body>
</html>
